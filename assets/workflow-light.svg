<svg xmlns="http://www.w3.org/2000/svg" width="640" height="646" viewBox="0 0 640 646" role="img" aria-labelledby="title desc">
  <title id="title">How the CoreSpeed SEO skill works</title>
  <desc id="desc">Five steps: check tools and prices; audit pages and search results; plan by impact over effort; fix only after your OK; track with snapshots and diffs. Spending needs approval before the audit, and each site change needs approval before a fix. Tracking repeats from the audit on a schedule.</desc>
